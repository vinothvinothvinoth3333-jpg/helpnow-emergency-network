<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HelpNow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">HelpNow</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('report') }}">Report Emergency</a>
        </div>
    </nav>
    <main class="report-section">
        <h1>Owner Login</h1>
        <p>Sign in to view emergency reports, contact numbers, and user locations.</p>
        {% if error %}
        <p class="form-message error">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('login', next=request.args.get('next', 'owner_dashboard')) }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
